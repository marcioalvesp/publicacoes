<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air View BH</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>

        /* Paleta Profissional - Padrão: MODO ESCURO (Slate System) */
        :root {
            /* Superfícies e Profundidade */
            --cor-fundo-body: #0f172a;       /* Slate 900 - Fundo base suavizado */
            --cor-fundo-card: #1e293b;       /* Slate 800 - Cards e Seções elevados */
            --cor-fundo-cortina-lateral: #1e293b;    /* Slate 800 - Cortina lateral */
            --cor-fundo-modal: #334155;      /* Slate 700 - Modais em destaque */
            --cor-borda: #334155;            /* Slate 700 - Linhas sutis */

            /* Tipografia (Opacidade e conforto visual) */
            --cor-titulo-secao: #f8fafc;     /* Slate 50 - Destaque principal */
            --cor-texto: #cbd5e1;            /* Slate 300 - Leitura contínua */
            --cor-rotulos: #94a3b8;          /* Slate 400 - Rótulos e labels */
            
            /* Inputs e Controles */
            --cor-input-fundo: #0f172a;      /* Recuo visual nos campos */
            --cor-input-texto: #f8fafc;

            /* Acentos e Semantic Colors (Desaturados) */
            --cor-links-aux: #38bdf8;        /* Sky 400 */
            --cor-sucesso: #4ade80;          /* Green 400 */
            --cor-erro: #f87171;             /* Red 400 */
            --cor-mensagens: #fef08a;        /* Yellow 200 */
            --cor-clara: #334155;

            --cor-btn-principal-fundo: #334155;        /* Slate 700 */
            --cor-btn-principal-texto: #f8fafc;        /* Slate 50 */
            --cor-btn-principal-hover: #475569;        /* Slate 600 */

            --cor-select-item-fundo: #334155;          /* Slate 700 */
            --cor-select-item-texto: #38bdf8;

            --filtro-icone-date: invert(0.9);
            --largura-cortina-lateral: 320px;
        }

        /* Sobrescrita para MODO CLARO (Suave e Técnico) */
        [data-theme="claro"] {
            --cor-fundo-body: #f8fafc;       /* Slate 50 */
            --cor-fundo-card: #ffffff;       /* Branco limpo */
            --cor-fundo-cortina-lateral: #0f172a;    /* Slate 900 - Mantém destaque escuro/elegante */
            --cor-fundo-modal: #ffffff;
            --cor-borda: #e2e8f0;            /* Slate 200 */

            --cor-titulo-secao: #0f172a;     /* Slate 900 */
            --cor-texto: #334155;            /* Slate 700 */
            --cor-rotulos: #475569;          /* Slate 600 */

            --cor-input-fundo: #ffffff;
            --cor-input-texto: #0f172a;

            --cor-links-aux: #0284c7;        /* Sky 600 */
            --cor-sucesso: #16a34a;
            --cor-erro: #dc2626;
            --cor-clara: #f1f5f9;

            --cor-btn-principal-fundo: #e2e8f0;        /* Slate 200 */
            --cor-btn-principal-texto: #0f172a;        /* Slate 900 */
            --cor-btn-principal-hover: #cbd5e1;        /* Slate 300 */

            --cor-select-item-fundo: #c9c9c9;          /* Sky 100 */
            --cor-select-item-texto: #252525;          /* Sky 600 */

            --filtro-icone-date: invert(0.2);
        }

        body {
            /* font-family: 'Inter', 'Montserrat', 'Roboto', sans-serif; */
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            margin: 0;
            display: flex;
            color: var(--cor-texto);
            background: var(--cor-fundo-body);;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }

        #dialogSis {
            border: 1px solid var(--cor-borda);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 20em;
            
            /* Cores que mudam sozinhas conforme o tema ativo */
            background-color: var(--cor-fundo-modal);
            color: var(--cor-texto);
            
            /* Sombra profunda para dar ideia de elevação na tela */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 
                        0 10px 10px -5px rgba(0, 0, 0, 0.15);
        }

        #dialogSis::backdrop {
            background-color: rgba(15, 23, 42, 0.75); /* Base Slate 900 com opacidade */
            backdrop-filter: blur(4px);               /* Efeito fosco técnico profissional */
        }

        #dialogSisTitulo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--cor-titulo-secao);
            margin-bottom: 10px;
        }

        #dialogSisMensagem {
            font-size: 0.95rem;
            color: var(--cor-texto);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .dialog-botoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .dialog-botoes button {
            font-family: inherit;
            padding: 10px 18px;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: filter 0.15s ease, background-color 0.15s ease;
        }

        .dialog-botoes button:hover {
            filter: brightness(1.15);
        }

        .btn-secundario {
            background-color: var(--cor-clara);
            /* Garante contraste de texto no botão secundário seletivamente */
            color: var(--cor-texto); 
        }

        .btn-perigo {
            background-color: var(--cor-erro);
            color: #ffffff; /* Texto branco fixo para leitura no fundo vermelho */
        }

        .cortina-lateral {
            position: fixed;
            right: calc(-1 * var(--largura-cortina-lateral));
            top: 0;
            width: var(--largura-cortina-lateral);
            height: 100%;
            background: var(--cor-fundo-cortina-lateral);
            color: #f8fafc;
            transition: right 0.35s ease-in-out;
            z-index: 1000;
            padding: 1.56em;
            box-sizing: border-box;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.3);
        }

        .cortina-lateral.aberta {
            right: 0;
        }

        .icone-config {
            position: fixed;
            top: 0.7em;
            right: 0.7em;
            padding: 0.4em;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 1001;
            background: var(--cor-titulo-secao);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .texto-explicativo {
            font-size: 0.85em;
            color: #666;
        }
        
        .texto-observacao {
            font-size: 0.7em;
            margin-top: 1.25em;
            color: #7f8c8d;
        }

        /* Modais */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-conteudo {
            background: var(--cor-fundo-modal);
            color: var(--cor-texto);
            padding: 1.88em;
            border-radius: 8px;
            width: 25em;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--cor-borda);
        }

        .modal-conteudo .texto-explicativo {
            color: var(--cor-rotulos);
        }

        .escondido {
            display: none !important;
        }

        /* Estrutura Principal */
        main {
            padding: 40px;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .secao {
            background: var(--cor-fundo-card);
            padding: 1.56em;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            margin-bottom: 1.25em;
            border: 1px solid var(--cor-borda);
            box-sizing: border-box;
            /*
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            display: block;
            */
        }
        
        /* Formulários */
        .texto-título-app {
            margin-top: 0;
            color: var(--cor-titulo-secao);
        }
        
        .texto-versão-app {
            font-weight: normal;
            font-size: 0.7em;
            vertical-align: middle;
            color: #999;
        }

        .grid-filtros-linha1 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(13.75em, 1fr));
            gap: 1.25em;
            margin-bottom: 1.25em;
        }

        .grid-filtros-linha2 {
            display: flex;
            flex-wrap: wrap;
            gap: 1.25em;
            margin-bottom: 1.25em;
        }

        .grid-filtros-linha2 > *:nth-child(1) {
            flex: 2 1 15em;
        }

        .grid-filtros-linha2 > *:nth-child(2) {
            flex: 2 1 10em;
        }

        .grid-filtros-linha2 > *:nth-child(3) {
            flex: 3 1 22em;
        }

        .grupo-campo {
            display: flex;
            flex-direction: column;
        }

        .grupo-campo label {
            margin-left: 0.6em;
        }

        .grupo-titulo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1em;
            color: var(--cor-rotulos);
        }

        select,
        input {
            padding: 7px;
            border: 1px solid var(--cor-borda);
            background-color: var(--cor-input-fundo);
            color: var(--cor-input-texto);
            border-radius: 4px;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            font-size: 0.84em;
            overflow-x: auto;
            overflow-y: auto;
        }

        select#modoDados {
            padding-top: 0,8em;
        }

        select#entrDadosSelecaoSimples {
            height: 5.2em; 
        }

        select option {
            font-family: monospace;
            font-size: 1.25em;
            background-color: var(--cor-input-fundo);
            color: var(--cor-input-texto);
        }

        select option:checked {
            background-color: var(--cor-select-item-fundo) !important;
            color: var(--cor-select-item-texto) !important;
            font-weight: bold;
        }

        select option:hover,
        select option:focus,
        select option:active {
            background-color: var(--cor-select-item-fundo) !important;
            color: var(--cor-select-item-texto) !important;
        }

        input[type="datetime-local"] {
            height: 5.2em;
            text-align: center;
            padding: 0 3vw;
            box-sizing: border-box;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: var(--filtro-icone-date);
            transition: filter 0.2s ease, opacity 0.2s ease;
            padding: 2px;
            border-radius: 4px;
        }

        /* Efeito ao passar o mouse sobre o ícone */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover {
            opacity: 0.8;
        }

        select[multiple] {
            height: 15.5em; 
        }

        .campo-erro {
            border: 2px solid var(--cor-erro) !important;
            /* background-color: #fff6f6; */
        }

        /* Botões */
        button {
            padding: 0.75em 1.25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            font-weight: bold;
            font-size: 1em;
        }

        .btn-principal {
            background: var(--cor-btn-principal-fundo);
            color: var(--cor-btn-principal-texto);
            border: 1px solid var(--cor-borda);
            width: 100%;
            margin-top: 0.63em;
            font-weight: 700;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
        }

        .btn-principal:hover {
            background: var(--cor-btn-principal-hover);
            color: var(--cor-btn-principal-texto);
            transform: translateY(-1px);
        }

        .btn-config-princ {
            background: var(--cor-sucesso);
            color: white;
            font-size: 1em;
        }

        .btn-config-princ:hover {
            background: #219150;
        }
        
		.btn-config-princ-vertical {
            margin-top: 2.5em;
        }

        .btn-config-sec {
            background: var(--cor-titulo-secao);
            color: white;
            font-size: 0.9em;
        }

        .btn-config-sec:hover {
            background: #45617d; /* #dbdbdb; */
        }
        
		.btn-config-sec-vertical {
            margin-top: 1.25em;
        }

        .btn-claro {
            background: none;
            color: #999;
            margin-top: 1.25em;
            font-size: 0.8em;
        }

        .btn-claro:hover {
            background: #f0f0f0;
        }


        .btn-tab-pri {
            background: #077d3e;
            /* border: 1px solid #989694 */;
            color: white;
            font-size: 0.8em;
            padding: 0.8em 1em;
        }

        .btn-tab-pri:hover {
            background: #219150;
        }

        .btn-tab-sec {
            background: #cfcfcf;
            color: #1c5aa5;
            font-size: 0.7em;
            padding: 0.9em 1em 0.9em 0.5em;
        }

        .btn-tab-sec:hover {
            background: #e6e6e6;
        }


        /* Seleção Rápida */
        .controles-selecao {
            display: flex;
            gap: 0.63em;
            margin-bottom: 0.375em;
        }

        .link-selecao {
            font-size: 0.75em;
            color: var(--cor-links-aux);
            text-decoration: none;
            font-weight: bold;
        }

        .link-selecao:hover {
            text-decoration: underline;
        }

        /* Mensagens da aplicação */
        #caixaLog {
            background: #1e1e1e;
            color: var(--cor-mensagens);
            padding: 0.94em;
            font-family: 'Consolas', monospace;
            line-height: 2.5;
            overflow-y: auto;
            border-radius: 4px;
            margin-bottom: 1.25em;
            font-size: 0.85em;
            border: 2px solid #333;
            width: 100%;
            height: 26em;
            max-width: 100%;
            box-sizing: border-box;
        }

        .area-tabela {
            overflow-x: auto;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        table {
            width: max-content;
            border-collapse: collapse;
            font-size: 0.85em;
            display: table;
            margin-bottom: 0.31em;
            color: var(--cor-texto);
        }

        th {
            background: var(--cor-fundo-card);
            color: var(--cor-titulo-secao);
            border-bottom: 2px solid var(--cor-borda);
            padding: 0.75em;
            text-align: left;
            position: sticky;
            top: 0;
        }

        td {
            border-bottom: 1px solid var(--cor-borda);
            color: var(--cor-texto);
            padding: 0.625em;
        }

        tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>

    <div id="iconeConfig" class="icone-config" title="Configurações">⚙️</div>

    <dialog id="dialogSis">
        <div id="dialogSisTitulo">Título</div>
        <div id="dialogSisMensagem">Mensagem</div>
        <div class="dialog-botoes">
            <button id="dialogSisBtnNao" class="btn-secundario">Não</button>
            <button id="dialogSisBtnSim" class="btn-perigo">Sim</button>
            <button id="dialogSisBtnCancelar" class="btn-secundario">Cancelar</button>
        </div>
    </dialog>

    <!-- 
            ┌──────────────────────────────┐
            │ Seção ‧ 🅸                    │
            ┟──────────────────────────────┧
            ┃ Modal Inicial de credenciais ┃
            ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
    -->
    <div id="modalcredencenciais" class="modal escondido">
        <div class="modal-conteudo">
            <p class="texto-explicativo">Credenciais de acesso à API Rest fornecidas pelo provedor</p>
            <div class="grupo-campo">
                <label>ID da API</label>
                <input type="text" id="modalCredencId" placeholder="Credencencial: ID">
                <label style="margin-top: 20px;">Chave da API</label>
                <input type="text" id="modalCredencChave" placeholder="Credencencial: Chave (Key)">
                <button id="btnSalvarCredenciais" class="btn-config-princ btn-config-princ-vertical">Salvar e Continuar</button>
                <button id="btnPreecherCredMaisTarde" class="btn-claro">Preencher mais tarde</button>
            </div>
        </div>
    </div>

    <!-- 
            ┌──────────────────────────────────┐
            │ Seção ‧ ◨                        │
            ┟──────────────────────────────────┧
            ┃ Cortina Lateral de Configurações ┃
            ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
    -->
    <div id="cortinaLateral" class="cortina-lateral">
        <h3>
            <span class="texto-versão-app">v 3.0</span>
            Configurações
        </h3>
        <hr style="border: 0; border-top: 1px solid #455a64; margin-bottom: 20px;">
        <div class="grupo-campo">
            <label style="color: #bdc3c7;">ID da API</label>
            <input type="text" id="configCredencId" placeholder="Credencencial: ID">
            <label style="color: #bdc3c7; margin-top: 20px;">Chave da API</label>
            <input type="text" id="configCredencChave" placeholder="Credencencial: Chave (Key)">
            <label style="color: #bdc3c7; margin-top: 20px;">Separador de decimais</label>
            <select id="configSeparadorDec">
                <option value="v" selected>Vírgula</option>
                <option value="p">Ponto</option>
            </select>
            <label style="color: #bdc3c7; margin-top: 20px;">Tema da Interface</label>
            <select id="configTemaTela">
                <option value="escuro" selected>Escuro</option>
                <option value="claro">Claro</option>
            </select>
            <button id="btnSalvarConfigs" class="btn-config-princ btn-config-princ-vertical" style="width: 100%;">Atualizar Configurações</button>
            <button id="btnExcluirConfigs" class="btn-config-sec btn-config-sec-vertical" style="width: 100%;">Excluir Configurações</button>
        </div>
        <br>
        <p class="texto-observacao">As credenciais são armazenadas localmente no seu navegador.</p>
        <p id="subsecHash" class="texto-observacao"></p>
    </div>

    <main>
        <h1 class="texto-título-app">PBH Projeto ProAR&nbsp;&nbsp;🍃&nbsp;🍂&nbsp;&nbsp;API Air View BH</h1>

        <!-- 
              ┌───────────────────────────────────────┐
              │ Seção . 🗀                            │
              ┟───────────────────────────────────────┧
              ┃ Entrada de dados (opções de consulta) ┃
              ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        -->
        <section id="secaoEntrDados" class="secao">
            <div class="grid-filtros-linha1">
                <div class="grupo-campo">
                    <label>Modo de Dados</label>
                    <select size=2 class="entrDadosSelecaoSimples" id="modoDados">
                        <option value="aggregate" selected>aggregate&nbsp;&nbsp;Dados Agregados</option>
                        <option value="raw">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;raw&nbsp;&nbsp;Dados Instantâneos</option>
                    </select>
                </div>

                <div id="containerDataRefIni" class="grupo-campo">
                    <label>Data Hora de Referência Início</label>
                    <input type="datetime-local" step="1" id="dataReferenciaIni">
                </div>

                <div class="grupo-campo">
                    <label>Data Hora de Referência Fim</label>
                    <input type="datetime-local" step="1" id="dataReferenciaFim">
                </div>

                <div id="containerIntervAgreg" class="grupo-campo escondido">
                    <label>Intervalo de Agregação</label>
                    <select size=3 class="entrDadosSelecaoSimples" id="tempoAgregacao">
                        <!-- option value="300">&nbsp;&nbsp;&nbsp;300&nbsp;&nbsp;&nbsp;5 minutos</option-->
                        <option value="900">&nbsp;&nbsp;&nbsp;900&nbsp;&nbsp;15 minutos</option>
                        <option value="3600" selected>&nbsp;3.600&nbsp;&nbsp;&nbsp;1 hora</option>
                        <option value="86400">86.400&nbsp;&nbsp;24 horas</option>
                    </select>
                </div>
            </div>

            <div id="gridFLinha2" class="grid-filtros-linha2">
                <div class="grupo-campo">
                    <div class="grupo-titulo">
                        <label>Sensores</label>
                        <div class="controles-selecao">
                            <a id="selecionarTodosSensores" href="javascript:void(0)" class="link-selecao" title="Selecionar todos">Todos</a>
                            <a id="inverterSelecaoSensores" href="javascript:void(0)" class="link-selecao" title="Inverter seleção">Inverter</a>
                        </div>
                    </div>
                    <select id="sensores" multiple>
                        <option value="32705" selected>32705&nbsp;&nbsp;Regional Hipercentro</option>
                        <option value="32709" selected>32709&nbsp;&nbsp;Regional Nordeste</option>
                        <option value="32753" selected>32753&nbsp;&nbsp;Regional Venda Nova</option>
                        <option value="32813" selected>32813&nbsp;&nbsp;Regional Barreiro</option>
                        <option value="33039" selected>33039&nbsp;&nbsp;Regional Noroeste</option>
                    </select>
                </div>

                <div id="containerAgregacoes" class="grupo-campo escondido">
                    <div class="grupo-titulo">
                        <label>Agregações</label>
                        <div class="controles-selecao">
                            <a id="selecionarTodasAgregs" href="javascript:void(0)" class="link-selecao" title="Selecionar todas">Todas</a>
                            <a id="inverterSelecaoAgregs" href="javascript:void(0)" class="link-selecao" title="Inverter seleção">Inverter</a>
                        </div>
                    </div>
                    <select id="agregacoes" multiple>

    <script>

        /* * * * * * * * * * * * * * * * * * * * * * * *                                                    * 
        * (1) https://patorjk.com/software/taag/#p=display&f=Colossal&t=+Infra&x=none&v=0&h=0&w=80&we=false *
        *                                                                                                   *
        *                                                                                                   *
        *          8888888               .d888                                                              *
        *            888                d88P"                                                               *
        *            888                888                                                                 *
        *            888     88888b.    888888   888d888   8888b.    (1)                                    *
        *            888     888 "88b   888      888P"        "88b                                          *
        *            888     888  888   888      888      .d888888                                          *
        *            888     888  888   888      888      888  888                                          * 
        *          8888888   888  888   888      888      "Y888888                                          *
        *                                                                                                   *
        *                                                                                                   *
        *  INFRAESTRUTURA: Persistência e acesso a dados externos                                           *
        *                                                                                                   *
        *      * indDB: Persistência em IndexedDB                                                           *
        *                                                                                                   *
        *      * repositorioDados: Persistência em IndexedDB ou em memória RAM                              *
        *                                                                                                   *

        const Infra = {

            indDB: (function() {
                const ESQUEMA_OBJ_ARMAZENADO = 'tipo_retorno_API';
                const CHAVE_OBJ_ARMAZENADO = 'ult_retorno_API';

                const conexaoIndexedDB = (function() {
                    let dbInstancia = null;
                    return function() {
                        return (
                            dbInstancia ?
                                Promise.resolve(dbInstancia) 
                            : 
                                new Promise(
                                    (resolve, reject) => {
                                        const NOME_DB = 'DB_API', VERSAO_DB = 1;
                                        const pedidoCriacaoDB = indexedDB.open(NOME_DB, VERSAO_DB);
                                        pedidoCriacaoDB.onupgradeneeded = (e) => {
                                            const db = e.target.result;
                                            if (! db.objectStoreNames.contains(ESQUEMA_OBJ_ARMAZENADO)) 
                                                db.createObjectStore(ESQUEMA_OBJ_ARMAZENADO)
                                        };
                                        pedidoCriacaoDB.onsuccess = (e) => {
                                            dbInstancia = e.target.result;
                                            resolve(dbInstancia);
                                        };
                                        pedidoCriacaoDB.onerror = (e) => 
                                            reject(`Armazenamento no «IndexedDB» do navegador negado: ${e.target.errorCode}`);
                                    }
                                )
                        )
                    }
                })();

                return {
                    async salvaObjeto(objRetornoAPI) {
                        const db = await conexaoIndexedDB();
                        return new Promise(
                            (resolve, reject) => {
                                const tr = db.transaction(ESQUEMA_OBJ_ARMAZENADO, 'readwrite');
                                const st = tr.objectStore(ESQUEMA_OBJ_ARMAZENADO);
                                const op = st.put(objRetornoAPI, CHAVE_OBJ_ARMAZENADO);
                                op.onsuccess = () => resolve(true);
                                op.onerror = () => reject(op.error);
                            }
                        );
                    },

                    async obtemObjeto() {
                        const db = await conexaoIndexedDB();
                        return new Promise(
                            (resolve, reject) => {
                                const tr = db.transaction(ESQUEMA_OBJ_ARMAZENADO, 'readonly');
                                const st = tr.objectStore(ESQUEMA_OBJ_ARMAZENADO);
                                const op = st.get(CHAVE_OBJ_ARMAZENADO);
                                op.onsuccess = () => resolve(op.result);
                                op.onerror = () => reject(op.error);
                            }
                        );
                    }
                };
            })(),

            repositorioDados: (function() {
                let varDadosSalvos = null;
                let ultStatusFuncSalva = '';
                const STATUS = Object.freeze({OK: 'ok', ERRO: 'er'});
                const DADOS_SALVOS_EM = Object.freeze({MEM: 'ram', DSK: 'idb'});
                const LIMIAR_PERFORMANCE = 4999;

                async function obtemPacoteCompleto() {
                    let varStatus = STATUS.OK;
                    let varDados = varDadosSalvos;
                    let objErro = null;

                    if (ultStatusFuncSalva === `${STATUS.OK}-${DADOS_SALVOS_EM.DSK}`) {
                        try {
                            varDados = await Infra.indDB.obtemObjeto();
                        } catch (erro) {
                            varStatus = STATUS.ERRO;
                            objErro = erro;
                        }
                    }
                    return { status: varStatus, pacote: varDados, erro: objErro };
                }

                return {
                    STATUS,
                    DADOS_SALVOS_EM,
                    async salva(objJson, matrizLinhas) {
                        const pacote = {json: objJson, linhas: matrizLinhas};
                        const quantLinhas = matrizLinhas ? matrizLinhas.length : 0;
                        let status = '', salvoEm = '';

                        if (! objJson || quantLinhas <= LIMIAR_PERFORMANCE) {
                            varDadosSalvos = pacote;
                            status = STATUS.OK;
                            salvoEm = DADOS_SALVOS_EM.MEM;
                        } else {
                            try {
                                await Infra.indDB.salvaObjeto(pacote);
                                varDadosSalvos = null;
                                status = STATUS.OK;
                                salvoEm = DADOS_SALVOS_EM.DSK;
                            } catch (erro) {
                                status = STATUS.ERRO;
                                salvoEm = DADOS_SALVOS_EM.MEM;
                                varDadosSalvos = pacote;
                            }
                        }
                        ultStatusFuncSalva = `${status}-${salvoEm}`;
                        return status;
                    },

                    async obtemJson() {
                        const { status, pacote, erro } = await obtemPacoteCompleto();
                        return { status, dados: pacote ? pacote.json : null, erro };
                    },

                    async obtemLinhas() {
                        const { status, pacote, erro } = await obtemPacoteCompleto();
                        return { status, dados: pacote ? pacote.linhas : [], erro };
                    }
                };
            })(),

            config: (function() {
                const localStorageInfo = {
                    nome: 'forncdr1050',
                    eventoAlteradoOutraAba: {
                        nome: 'locStChanged',
                        gestor: new EventTarget()
                    }
                };
                let configs = {};

                (function iniciaConfigsPadrao() {
                    configs = {
                        id: '', chave: '',
                        separadorDec: 'v', tema: 'escuro'
                    }
                })();

                (function acessaDadosNoLocalStorage() {
                    const strConfigsJson = localStorage.getItem(localStorageInfo.nome) || '';
                    if (strConfigsJson) {
                        const obj = JSON.parse(strConfigsJson);
                        if (obj) {
                            const props = Object.keys(obj);
                            if (props.includes('id')) configs.id = obj.id;
                            if (props.includes('chave')) configs.chave = obj.chave;
                            if (props.includes('separadorDec')) configs.separadorDec = obj.separadorDec;
                            if (props.includes('tema')) configs.tema = obj.tema;
                        }
                    }
                })();

                // Local storage alterado em outra aba
                window.addEventListener('storage', (event) => {
                    if (event.key === localStorageInfo.nome) {
                        acessaDadosNoLocalStorage();
                        const eventoAlt = localStorageInfo.eventoAlteradoOutraAba;
                        eventoAlt.gestor.dispatchEvent(
                            new CustomEvent(eventoAlt.nome,{ detail: configs })
                        );
                    }
                });

                return {
                    obtemNomeLocalStorage() {
                        return localStorageInfo.nome;
                    },
                    obtemConfigs() {
                        return { ...configs }
                    },
                    salvaConfigs(novasConfigs = {}) {
                        configs = { ...configs, ...novasConfigs }
                        localStorage.setItem(localStorageInfo.nome, JSON.stringify(configs));
                    },
                    excluiConfigs() {
                        localStorage.removeItem(localStorageInfo.nome);
                        iniciaConfigsPadrao();
                    },
                    localStorageAlteradoOutraAba(funcaoManipuladora) {
                        const eventoAlt = localStorageInfo.eventoAlteradoOutraAba;
                        eventoAlt.gestor.addEventListener(eventoAlt.nome, (e) => funcaoManipuladora(e.detail));
                    }
                }
            })(),

            apiRest: {
                consultar: async function(params) {
                    const corpoJson =  JSON.stringify(params.corpo);
                    const respJson = await fetch(params.uri, {
                        method: 'POST',
                        mode: 'cors',
                        headers: params.cabecalho,
                        body: corpoJson
                    });
                    return respJson
                }
            },

            util: {
                baixaBlob: function(blob, extensao) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `AirViewBH_${(new Date().toLocaleString('sv-SE')).replace(' ', 'T')}.${extensao}`;
                    a.click();
                },

                hashSHA1: async function() {
                    try {
                        // 1. Busca os bytes do próprio arquivo HTML
                        const resposta = await fetch(window.location.href);
                        const buffer = await resposta.arrayBuffer();

                        const hashBuffer = await crypto.subtle.digest('SHA-1', buffer);
                        
                        // 3. Converte o resultado para Hexadecimal
                        const hashArray = Array.from(new Uint8Array(hashBuffer));
                        const hashHex = hashArray
                            .map(b => b.toString(16).padStart(2, '0'))
                            .join('');
                        return hashHex;
                    } catch (erro) {
                        return '⸻';
                    }
                }
            }
        };


       /* * * * * * * * * * * * * * * * * * * * *                                       *

        *            d8888888888   888 d88P   888                                       *
        *           d88P     888   88888P"    888                                       *

        *                                                                               *
        *  APLICAÇÃO: Interface entre a apresentação (GUI) e a infraestrutura           *

        const Apl = {

            argumentosConsultaApi() {
				const modoDados = document.getElementById('modoDados').value;

				const periodoAg = (modoDados === 'raw') ? 0 : Number(document.getElementById('tempoAgregacao').value);

				const tempoDesde = Math.floor(( new Date(document.getElementById('dataReferenciaIni').value).getTime() ) / 1000);

                const tempoAte = Math.floor(( new Date(document.getElementById('dataReferenciaFim').value).getTime() ) / 1000);

				const sensores = Array.from(document.getElementById('sensores').selectedOptions).map(o => Number(o.value));

				const poluentesOuIQAr = Array.from(document.getElementById('poluentesOuIQAr').selectedOptions).filter(o => ! o.disabled).map(o => o.value);

				const agregacoes = (modoDados === 'raw') ? [] : Array.from(document.getElementById('agregacoes').selectedOptions).map(o => o.value);

                return {
                    "data_type": modoDados,
                    "aggregation_period": periodoAg,
                    "parameters": poluentesOuIQAr,
                    "parameter_attributes": agregacoes,
                    "things": sensores,

                    "upto_time": tempoAte
                };
            },

            async obtemDados(argumentosCorpoApi) {
                const txtIdn = document.getElementById('configCredencId');
                const txtChv = document.getElementById('configCredencChave');

                const cabecalho = {
                    'Access-Id': txtIdn.value,
                    'Access-Key': txtChv.value,
                    'Content-Type': 'application/json'
                };

                const paramsConsulta = {
                    uri: 'https://app.aurassure.com/-/api/iot-platform/v1.1.0/clients/19247/applications/16/things/data',
                    cabecalho: cabecalho,
                    corpo: argumentosCorpoApi
                }

                return await Infra.apiRest.consultar(paramsConsulta);
            },
            
            converteArrayObjParaCSV(matrizObjs, delimit = ';') {
                const separadorDec = document.getElementById('configSeparadorDec').value;
                const matCols = Object.keys(matrizObjs[0]);

                const matValsDelimit = matrizObjs.map(obj => {
                    const vals = matCols.map(chave => {
                        let val = obj[chave];
                        if (separadorDec === 'v') {
                            if (val !== '' && val !== null && ! isNaN(val)) {
                                val = Number(val).toLocaleString('pt-BR', {
                                    useGrouping: false,
                                    maximumFractionDigits: 20
                                })
                            }
                        }
                        return `"${val}"`;
                    });
                    return vals.join(delimit);
                });
                return [matCols.join(delimit), ...matValsDelimit].join('\r\n');
            },

            extraiLinhasDados(dados) {
                const dicSensores = {
                    '32705': 'Regional Hipercentro',
                    '32709': 'Regional Nordeste',
                    '32753': 'Regional Venda Nova',
                    '32813': 'Regional Barreiro',
                    '33039': 'Regional Noroeste'
                }

                function versaoAchatadaDoObj(obj, prefixo = "") {
                    const novoObj = {};
                    if (obj && typeof obj === 'object') {
                        Object.entries(obj).forEach(([chave, valor]) => {
                            const novaChave = (prefixo ? `${prefixo}_${chave}` : chave).toUpperCase();
                            if (valor === null) {
                                novoObj[novaChave] = ''; 
                            } else if (Array.isArray(valor)) {
                                novoObj[novaChave] = valor.join(', ');
                            } else if (typeof valor === 'object') {
                                Object.assign(novoObj, versaoAchatadaDoObj(valor, novaChave));
                            } else {
                                novoObj[novaChave] = valor;
                            }
                        });
                    }
                    return novoObj;
                }

                return dados.map(item => {
                    let linha = {
                        'ID_SENSOR': item.thing_id,
                        'NOME_SENSOR': (dicSensores[item.thing_id.toString()] || ''),
                        'DATA_H_API': item.time,
                        'DATA_LOCAL': new Date(item.time * 1000).toLocaleDateString('pt-BR'),
                        'HORA_LOCAL': new Date(item.time * 1000).toLocaleTimeString('pt-BR')
                    };
                    Object.assign(linha, versaoAchatadaDoObj(item.parameter_values));
                    return linha;
                });
            },

            ordenaObjJson(objJson, argsApi) {
                const dicOrdSensores = Object.fromEntries(argsApi.things.map((item, i) => [item, i]));
                const dicOrdValues = Object.fromEntries(argsApi.parameters.map((item, i) => [item, i]));
                const dicOrdAgreg = Object.fromEntries(argsApi.parameter_attributes.map((item, i) => [item, i]));

                const fComparadoraDic = function(dicOrd) {
                    return function(a, b) {
                        const ordA = dicOrd[a] ?? 999;
                        const ordB = dicOrd[b] ?? 999;
                        return ( ordA !== ordB || Number.isFinite(a) || Number.isFinite(b) ) ? (ordA - ordB) : a.localeCompare(b);
                    }
                };

                const novObj = structuredClone(objJson);

                const fComparadoraDicSensores = fComparadoraDic(dicOrdSensores);
                novObj.data = novObj.data.sort((a, b) => fComparadoraDicSensores(a.thing_id, b.thing_id));

                novObj.data = novObj.data.map(dta => {
                    const chavesValues = Object.keys(dta.parameter_values).sort(fComparadoraDic(dicOrdValues));
                    dta.parameter_values = Object.fromEntries(
                        chavesValues.map(chaveValues => {

                            let val = dta.parameter_values[chaveValues];
                            if (typeof val === 'object' && val !== null) {
                                const chavesAgreg = Object.keys(val).sort(fComparadoraDic(dicOrdAgreg));
                                val = Object.fromEntries(
                                    chavesAgreg.map(chaveAgreg => [chaveAgreg, val[chaveAgreg]])
                                );
                            }
                            return [chaveValues, val];
                        })
                    );
                    return dta;
                });
                return novObj;
            }
        }

        const GUI = {

                async mostraMsg(msg = '', titulo = '', icone = 'nenhum') {

                        'importante': '⚠️',

                    const tituloeMsg = [titulo, msg].filter(Boolean).join(': ');

                    const iconeTituloeMsg = [chrIcone, tituloeMsg].filter(Boolean).join(' ');

                    const caixa = document.getElementById('caixaLog');

                    // Libera a thread para renderizar o texto imediatamente antes de prosseguir

                async pedeConfirmacao(titulo, mensagem, opcoes = { mostrarCancelar: false }) {
                    return new Promise(
                        function(resolve) {

                                dialog: document.getElementById('dialogSis'),

                            elems.msg.textContent = mensagem;
                            elems.btnCan.hidden = ! opcoes.mostrarCancelar;
                            elems.dialog.showModal();
                        }
                    )
                }
            },

            Info: {
                validaModalCredenciais() {
                    const txtIdn = document.getElementById('modalCredencId');
                    const txtChv = document.getElementById('modalCredencChave');
                    let validado = true;

                    function limpaMensagemControle(elemento) {
                        elemento.setCustomValidity('');
                        elemento.classList.remove('campo-erro');
                    }

                    function adicionaMensagemControle(elemento, msg) {
                        elemento.setCustomValidity(msg);
                        elemento.classList.add('campo-erro');
                        if (validado) elemento.reportValidity();
                        validado = false;
                    }

                    limpaMensagemControle(txtIdn);
                    if (! txtIdn.value.trim()) {
                        adicionaMensagemControle(txtIdn, 'Id inválido');
                    }

                    limpaMensagemControle(txtChv);
                    if (! txtChv.value.trim()) {
                        adicionaMensagemControle(txtChv, 'Chave inválida');
                    }

                    return validado;
                },

                validaCortinaConfiguracoes() {
                    const txtIdn = document.getElementById('configCredencId');
                    const txtChv = document.getElementById('configCredencChave');
                    const selDec = document.getElementById('configSeparadorDec');
                    const selTma = document.getElementById('configTemaTela');
                    let validado = true;

                    function limpaMensagemControle(elemento) {
                        elemento.setCustomValidity('');
                        elemento.classList.remove('campo-erro');
                    }

                    function adicionaMensagemControle(elemento, msg) {
                        elemento.setCustomValidity(msg);
                        elemento.classList.add('campo-erro');
                        if (validado) elemento.reportValidity();
                        validado = false;
                    }

                    limpaMensagemControle(txtIdn);
                    if (! txtIdn.value.trim()) {
                        adicionaMensagemControle(txtIdn, 'Id inválido');
                    }

                    limpaMensagemControle(txtChv);
                    if (! txtChv.value.trim()) {
                        adicionaMensagemControle(txtChv, 'Chave inválida');
                    }

                    limpaMensagemControle(selDec);
                    if (selDec.selectedOptions.length === 0) {
                        adicionaMensagemControle(selDec, 'Nenum separador selecionado');
                    }

                    limpaMensagemControle(selTma);
                    if (selTma.selectedOptions.length === 0) {
                        adicionaMensagemControle(selTma, 'Nenum tema selecionado');
                    }

                    return validado;
                },

                async validaFrmPrincipal() {
                    const dtaIni = document.getElementById('dataReferenciaIni');
                    const dtaFim = document.getElementById('dataReferenciaFim');
                    const sensor = document.getElementById('sensores');
                    const agregs = document.getElementById('agregacoes');
                    const poluen = document.getElementById('poluentesOuIQAr');
                    const txtIdn = document.getElementById('configCredencId');
                    const txtChv = document.getElementById('configCredencChave');
                    let validado = true;

                    function limpaMensagemControle(elemento) {
                        elemento.setCustomValidity('');
                        elemento.classList.remove('campo-erro');
                    }

                    function adicionaMensagemControle(elemento, msg) {
                        elemento.setCustomValidity(msg);
                        elemento.classList.add('campo-erro');
                        if (validado) elemento.reportValidity();
                        validado = false;
                    }

                    limpaMensagemControle(txtIdn);
                    if (! txtIdn.value.trim()) {
                        document.getElementById('cortinaLateral').classList.toggle('aberta');
                        // Libera a thread para renderizar o texto imediatamente antes de prosseguir
                        await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
                        adicionaMensagemControle(txtIdn, 'Id da API necessário para acessar os dados');
                    }
                    limpaMensagemControle(txtChv);
                    if (! txtChv.value.trim()) {
                        document.getElementById('cortinaLateral').classList.toggle('aberta');
                        // Libera a thread para renderizar o texto imediatamente antes de prosseguir
                        await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
                        adicionaMensagemControle(txtChv, 'Chave da API necessária para acessar os dados');
                    }

                    limpaMensagemControle(dtaIni);
                    limpaMensagemControle(dtaFim);
                    const tmIni = new Date(dtaIni.value).getTime();
                    const tmFim = new Date(dtaFim.value).getTime();
                    const dtNow = new Date();
                    const tmNow = dtNow.getTime();
                    if (isNaN(tmIni)) {
                        adicionaMensagemControle(dtaIni, 'Data ou hora inicial inválida');
                    } else if (isNaN(tmFim)) {
                        adicionaMensagemControle(dtaFim, 'Data ou hora final inválida');
                    } else if (tmIni > tmNow) {
                        adicionaMensagemControle(dtaIni, `Data/hora inicial maior que a data atual (${dtNow.toLocaleString(navigator.language)})`);
                    } else if (tmFim > tmNow) {
                        adicionaMensagemControle(dtaFim, `Data/hora final maior que a data atual (${dtNow.toLocaleString(navigator.language)})`);
                    } else if (tmIni > tmFim) {
                        adicionaMensagemControle(dtaIni, 'A Data/Hora inicial deve ser anterior ou igual à Data/Hora final');
                        adicionaMensagemControle(dtaFim, 'A Data/Hora inicial deve ser anterior ou igual à Data/Hora final');
                    }

                    limpaMensagemControle(sensor);
                    if (sensor.selectedOptions.length === 0) {
                        adicionaMensagemControle(sensor, 'Necessário escolher pelo menos um dos sensores');
                    }

                    limpaMensagemControle(agregs);
                    if (agregs.selectedOptions.length === 0) {
                        adicionaMensagemControle(agregs, 'Necessário escolher pelo menos uma das agregações');
                    }

                    limpaMensagemControle(poluen);
                    if (poluen.selectedOptions.length === 0) {
                        adicionaMensagemControle(poluen, 'Necessário escolher pelo menos um dos poluentes/IQAr');
                    }
                    
                    return validado;
                }
            },

            Ini: {
                preencheInputsConfig(configs = null) {
                    if (!configs) configs = Infra.config.obtemConfigs();
                    document.getElementById('modalCredencId').value = configs.id;
                    document.getElementById('configCredencId').value = configs.id;
                    document.getElementById('modalCredencChave').value = configs.chave;
                    document.getElementById('configCredencChave').value = configs.chave;
                    document.getElementById('configSeparadorDec').value = configs.separadorDec;
                    document.getElementById('configTemaTela').value = configs.tema;
                },

                async preencheInputsOpcoesConsulta() {

                    document.getElementById('subsecHash').textContent = await Infra.util.hashSHA1();

                    const umaHoraEmMs = 60 * 60 * 1000
                    const dataFim = new Date( new Date() - umaHoraEmMs );
                    const dataIni = new Date(dataFim - umaHoraEmMs);
                    document.getElementById('dataReferenciaIni').value = `${dataIni.toLocaleString('sv-SE').slice(0, 13)}:00:00`;
                    document.getElementById('dataReferenciaFim').value = `${dataFim.toLocaleString('sv-SE').slice(0, 13)}:00:59`;
                },

                criaEventosConfigs() {
                    document.getElementById('iconeConfig').onclick = (e) => {
                        document.getElementById('cortinaLateral').classList.toggle('aberta');
                    };

                    document.addEventListener('click', (e) => {
                        const cortinaLateral = document.getElementById('cortinaLateral');
                        if (cortinaLateral.classList.contains('aberta')) {
                            const iconeConfig = document.getElementById('iconeConfig');
                            if (! cortinaLateral.contains(e.target) && ! iconeConfig.contains(e.target)) {
                                cortinaLateral.classList.remove('aberta');
                            }
                        }
                    }, { once: true });

                    document.getElementById('dialogSisBtnSim').onclick = (e) => 
                        document.getElementById('dialogSis').close('sim');

                    document.getElementById('dialogSisBtnNao').onclick = (e) => 
                        document.getElementById('dialogSis').close('nao');

                    document.getElementById('dialogSisBtnCancelar').onclick = (e) => 
                        document.getElementById('dialogSis').close('cancel');

                    document.getElementById('btnSalvarCredenciais').onclick = (e) => {
                        if (GUI.Info.validaModalCredenciais()) {
                            const txtIdnModal = document.getElementById('modalCredencId');
                            const txtChvModal = document.getElementById('modalCredencChave');
                            Infra.config.salvaConfigs({id: txtIdnModal.value, chave: txtChvModal.value});
                            GUI.Ini.preencheInputsConfig();
                            GUI.Dialog.mostraMsg('Credenciais salvas.', '', 'ok');
                        }
                    }

                    document.getElementById('btnPreecherCredMaisTarde').onclick = (e) => {
                        document.getElementById('modalcredencenciais').classList.add('escondido');
                    }

                    document.getElementById('configTemaTela').onchange = (e) => {
                        const temaSelecionado = e.target.value;
                        // Aplica o atributo data-theme na tag <html>
                        document.documentElement.setAttribute('data-theme', temaSelecionado);
                    }

                    document.getElementById('btnSalvarConfigs').onclick = (e) => {
                        if (GUI.Info.validaCortinaConfiguracoes()) {
                            const txtIdnCfg = document.getElementById('configCredencId');
                            const txtChvCfg = document.getElementById('configCredencChave');
                            const selectDec = document.getElementById('configSeparadorDec');
                            const selectTma = document.getElementById('configTemaTela');
                            Infra.config.salvaConfigs({
                                id: txtIdnCfg.value, chave: txtChvCfg.value, 
                                separadorDec: selectDec.value, tema: selectTma.value
                            });
                            GUI.Dialog.mostraMsg('Configurações salvas.', '', 'ok');
                        }
                    }

                    document.getElementById('btnExcluirConfigs').onclick = async (e) => {
                        if (await GUI.Dialog.pedeConfirmacao('Exclusão de Configurações', 'Excluir todas as configurações?') === 'sim') {
                            Infra.config.excluiConfigs();
                            GUI.Ini.preencheInputsConfig();
                            GUI.Dialog.mostraMsg('Configurações removidas!', '', 'ok');
                        }
                    }

                    Infra.config.localStorageAlteradoOutraAba((configs) => {
                        GUI.Ini.preencheInputsConfig(configs);
                    })
                },

                criaEventosOpcoesConsulta() {

                    document.getElementById('modoDados').onchange = (e) => {
                        const modo = e.target.value;
                        const modoInstantaneo = (modo === 'raw');
                        document.getElementById('containerIntervAgreg').classList.toggle('escondido', modoInstantaneo);
                        document.getElementById('containerAgregacoes').classList.toggle('escondido', modoInstantaneo);
                        document.querySelector('#poluentesOuIQAr option[value="aqi"]').disabled = modoInstantaneo;
                    }

                    function selectAll(idSelect) {
                        const select = document.getElementById(idSelect);
                        [...select.options].forEach(opt => {
                            if (! opt.disabled) {
                                opt.selected = true
                            }
                        });
                    }

                    document.getElementById('selecionarTodosSensores').onclick = (e) => selectAll('sensores');

                    document.getElementById('selecionarTodasAgregs').onclick = (e) => selectAll('agregacoes');

                    document.getElementById('selecionarTodosPoluen').onclick = (e) => selectAll('poluentesOuIQAr');

                    function selectInv(idSelect) {
                        const select = document.getElementById(idSelect);
                        [...select.options].forEach(opt => {
                            if (! opt.disabled) {
                                opt.selected = ! opt.selected
                            }
                        });
                    }

                    document.getElementById('inverterSelecaoSensores').onclick = (e) => selectInv('sensores');

                    document.getElementById('inverterSelecaoAgregs').onclick = (e) => selectInv('agregacoes');

                    document.getElementById('inverterSelecaoPoluen').onclick = (e) => selectInv('poluentesOuIQAr');

                    document.getElementById('btnProcessar').onclick = async function(e) {
                        if (! GUI.Info.validaFrmPrincipal()) return;

                        let faseProcesso = 'Preparação';

                        try {
                            GUI.Dialog.mostraMsg('☁ Requisitando dados ao servidor...');
                            GUI.Dialog.mudaEstadoOcupado();
                            const argsApi = Apl.argumentosConsultaApi();

                            faseProcesso = 'Comunicação com a API';
                            const respostAPI = await Apl.obtemDados(argsApi);
                            //await new Promise(r => setTimeout(r, 5000));

                            faseProcesso = 'Leitura da resposta';
                            if (! respostAPI) throw new Error('Resposta da API vazia!');

                            faseProcesso = 'Obtenção dos dados';
                            if (! respostAPI.ok) {
                                const corpoErroTxt = await respostAPI.text();
                                throw new Error(`✉ Erro de comunicação status ${respostAPI.status}: ${respostAPI.statusText} ${corpoErroTxt}`);
                            }
                            let objCorpoResposta = await respostAPI.json();

                            faseProcesso = 'Classificação dos dados';
                            objCorpoResposta = Apl.ordenaObjJson(objCorpoResposta, argsApi);

                            faseProcesso = 'Reserva dos dados';
                            const arrayObjetosApi = Apl.extraiLinhasDados(objCorpoResposta.data);
                            await Infra.repositorioDados.salva(objCorpoResposta, arrayObjetosApi);

                            faseProcesso = 'Preenchimento da tabela';
                            GUI.Ini.preencheTabela(arrayObjetosApi.slice(0, 500), argsApi);

                            GUI.Dialog.mostraMsg(`✅ Processamento concluído. ${arrayObjetosApi.length} linha(s) geradas`);
                        } catch (erro) {
                            console.error(`Erro ${faseProcesso}:`, erro);
                            GUI.Dialog.mostraMsg(String(erro), faseProcesso, 'importante');
                            if (erro.message.toLowerCase().includes("fetch")) {
                                GUI.Dialog.mostraMsg('&nbsp;&nbsp;&nbsp;&nbsp;💭 Sem conexão com a API ou ela está ocupada. Verifique também a política de CORS');
                            }
                        } finally {
                            GUI.Dialog.mudaEstadoOcupado(false);
                        }
                    }

                    document.getElementById('btnSalvarCsv').onclick = async function(e) {
                        try {
                            GUI.Dialog.mudaEstadoOcupado();
                            const {status, dados, erro} = await Infra.repositorioDados.obtemLinhas();

                            if (status === Infra.repositorioDados.STATUS.OK) {
                                if (dados.length) {
                                    GUI.Dialog.mostraMsg('⏳ Convertendo lista de informações...');
                                    const txtCsv = Apl.converteArrayObjParaCSV(dados);

                                    GUI.Dialog.mostraMsg('♻ Transformando em texto...');
                                    const blobCsv = new Blob([txtCsv], { type: 'text/csv;charset=utf-8;' })

                                    GUI.Dialog.mostraMsg('⭳ Baixando csv...');
                                    Infra.util.baixaBlob(blobCsv, 'csv');

                                    GUI.Dialog.mostraMsg('✅ Csv baixado com sucesso!');
                                } else {
                                    GUI.Dialog.mostraMsg('Não há conteúdo CSV para ser baixado', 'Salvar como CSV', 'importante');
                                }
                            } else {
                                GUI.Dialog.mostraMsg(String(erro), '⚠️ Erro ao obter os dados', 'importante');
                            }
                        } catch (er) {
                            GUI.Dialog.mostraMsg(String(er), '⚠️ Erro ao salvar como csv', 'importante');
                        } finally {
                            GUI.Dialog.mudaEstadoOcupado(false);
                        }
                    }

                    document.getElementById('btnSalvarJson').onclick = async function(e) {
                        try {
                            GUI.Dialog.mudaEstadoOcupado();
                            const {status, dados, erro} = await Infra.repositorioDados.obtemJson();

                            if (status === Infra.repositorioDados.STATUS.OK) {
                                if (dados) {
                                    GUI.Dialog.mostraMsg('♻ Transformando em texto...');
                                    const strJson = JSON.stringify(dados, null, 2);

                                    GUI.Dialog.mostraMsg('⭳ Baixando json...');
                                    Infra.util.baixaBlob(new Blob([strJson]), 'json');

                                    GUI.Dialog.mostraMsg('✅ Json baixado com sucesso!');
                                } else {
                                    GUI.Dialog.mostraMsg('Não há conteúdo JSON para ser baixado', 'Salvar como JSON', 'importante');
                                }
                            } else {
                                GUI.Dialog.mostraMsg(String(erro), '⚠️ Erro ao obter os dados', 'importante');
                            }
                        } catch (er) {
                            GUI.Dialog.mostraMsg(String(er), '⚠️ Erro ao salvar como json', 'importante');
                        } finally {
                            GUI.Dialog.mudaEstadoOcupado(false);
                        }
                    }
                },

                preencheTabela(matrizObjs, objParams) {
                    const separadorDec = document.getElementById('configSeparadorDec').value;
                    const tabela = document.getElementById('tabelaDados');
                    const tHead = document.createElement('thead');
                    const tBody = document.createElement('tbody');
                    
                    if (matrizObjs && matrizObjs.length) {

                        const tHeadTr = document.createElement('tr');
                        const colunas = Object.keys(matrizObjs[0]);

                        colunas.forEach(nomeCol => {
                            const th = document.createElement('th');
                            th.textContent = nomeCol;
                            tHeadTr.appendChild(th);
                        });
                        tHead.appendChild(tHeadTr);

                        const fragmento = document.createDocumentFragment(); // Fragmento de memória para otimizar o processamento DOM
                        matrizObjs.forEach(obj => {
                            const tBodyTr = document.createElement('tr');
                            colunas.forEach(chave => {
                                const td = document.createElement('td');
                                let val = obj[chave]
                                if (separadorDec === 'v') {
                                    if (val !== '' && val !== null && ! isNaN(val)) {
                                        val = Number(val).toLocaleString('pt-BR', {
                                            useGrouping: false,
                                            maximumFractionDigits: 20
                                        })
                                    }
                                }
                                td.textContent = (val !== null && val !== undefined) ? val : '';
                                tBodyTr.appendChild(td);
                            });
                            fragmento.appendChild(tBodyTr);
                        });
                        tBody.appendChild(fragmento);
                    }

                    tabela.replaceChildren(tHead, tBody);
                    
                    const copiaParams = {...objParams};
                    const tempoDesde = 
                    copiaParams.from_time = `${copiaParams.from_time} ⟮${new Date(copiaParams.from_time * 1000).toLocaleString('pt-BR', { timeZoneName: 'shortOffset' })}⟯`;
                    copiaParams.upto_time = `${copiaParams.upto_time} ⟮${new Date(copiaParams.upto_time * 1000).toLocaleString('pt-BR', { timeZoneName: 'shortOffset' })}⟯`;
                    const divParams = document.getElementById('paramsTabela');
                    const dl = document.createElement('dl');
                    const dt = document.createElement('dt');
                    dt.innerHTML = '&nbsp;<strong>Informações de base para esta consulta</strong>';
                    dl.appendChild(dt);
                    Object.entries(copiaParams).forEach(([chave, valor]) => {
                        const dd = document.createElement('dd');
                        if (Array.isArray(valor)) {
                            dd.textContent = `${chave}: ${valor.join(', ')}`
                        } else {
                            dd.textContent = `${chave}: ${valor}`
                        }
                        dl.appendChild(dd);
                    });
                    divParams.replaceChildren(dl);
                    divParams.classList.remove('escondido');
                }
            }
        };

        window.addEventListener('pageshow', () => {
            /* Caso a aba seja duplicada, este evento só será executado 
                 após a restauração do estado dos elementos.
            */
            try {
                GUI.Ini.preencheInputsConfig();
                GUI.Ini.preencheInputsOpcoesConsulta();
                GUI.Ini.criaEventosConfigs();
                GUI.Ini.criaEventosOpcoesConsulta();

                document.getElementById('modoDados').dispatchEvent(
                    new Event('change', { bubbles: true })
                );

                document.getElementById('configTemaTela').dispatchEvent(
                    new Event('change', { bubbles: true })
                );

                if (! document.getElementById('modalCredencId').value) {
                    document.getElementById('modalcredencenciais').classList.remove('escondido');
                }
            } catch(erro) {
                GUI.Dialog.mostraMsg(String(erro), '⚠️ Interface iniciada com erro', 'importante');
            }
        });
    </script>
